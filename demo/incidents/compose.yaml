x-app: &app
  image: ${COMPOSE_PROJECT_NAME}-incidents:local
  build:
    context: ../..
    dockerfile: demo/incidents/Dockerfile
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: incident_demo
      POSTGRES_PASSWORD: disposable-only
      POSTGRES_DB: incident_demo
    volumes: [audit_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U incident_demo -d incident_demo']
      interval: 2s
      timeout: 3s
      retries: 30
  fixture:
    <<: *app
    command: [python, -m, demo.incidents.fixture]
    volumes: [fixture_data:/fixture:ro]
  verify:
    <<: *app
    command: [python, -m, demo.incidents.verify]
    environment:
      POSTGRES_USER: incident_demo
      POSTGRES_PASSWORD: disposable-only
      POSTGRES_DB: incident_demo
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
    volumes: [fixture_data:/fixture]
    depends_on:
      db: {condition: service_healthy}
      fixture: {condition: service_started}
volumes:
  audit_data:
  fixture_data:
